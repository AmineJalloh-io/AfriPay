<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>AfriPay | Mobile Money & Payment Hub</title>
    <style>
        /* ================================================================
           RESET & BASE
           ================================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: linear-gradient(145deg, #eef2f7 0%, #d9e2ec 100%);
            min-height: 100vh;
            padding: 0.7rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .app-card {
            max-width: 648px;
            width: 100%;
            background: #ffffff;
            border-radius: 1.6rem;
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.22);
            overflow: hidden;
        }

        /* ================================================================
           HEADER - Aligned with logo & brand text
           ================================================================ */
        .live-header {
            background: linear-gradient(135deg, #0a2b3c 0%, #1c4e6c 100%);
            padding: 0.4rem 0.6rem;
            color: white;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
            min-height: 56px;
            position: relative;
            z-index: 10;
        }
        .logo-container {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .africa-map-logo {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(255, 255, 255, 0.07);
            padding: 2px 10px 2px 5px;
            border-radius: 30px;
            transition: all 0.3s ease;
        }
        .africa-map-logo:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.02);
        }
        .afripay-logo-svg {
            width: 40px;
            height: 40px;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }
        .afripay-logo-svg:hover {
            transform: rotate(-5deg) scale(1.05);
        }
        .brand-text {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFF, #FFD966, #6bc6ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            cursor: default;
            line-height: 1.2;
        }
        #dashboardTrigger {
            cursor: pointer;
            transition: 0.15s;
            display: inline-block;
        }
        #dashboardTrigger:hover {
            transform: scale(1.1);
            color: #ffd966;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-wrap: wrap;
            justify-content: flex-end;
            flex: 1;
        }
        .datetime-box {
            background: rgba(0, 0, 0, 0.25);
            padding: 0.1rem 0.5rem;
            border-radius: 30px;
            text-align: center;
            font-size: 0.7rem;
            line-height: 1.2;
            min-width: 65px;
        }
        .time-text {
            font-weight: 700;
            font-size: 0.8rem;
        }
        .lang-selector {
            display: flex;
            align-items: center;
            gap: 3px;
            background: rgba(255, 255, 255, 0.10);
            border-radius: 30px;
            padding: 2px 5px 2px 8px;
            height: 34px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .lang-selector select {
            background: transparent;
            border: none;
            color: white;
            font-weight: 600;
            font-size: 0.8rem;
            outline: none;
            cursor: pointer;
            padding: 2px 2px;
            width: 58px;
        }
        .lang-selector select option {
            background: #1c4e6c;
            color: white;
        }
        .lang-icon {
            font-size: 0.95rem;
            line-height: 1;
        }
        .agent-dropdown-container {
            position: relative;
            min-width: 110px;
            max-width: 160px;
        }
        .agent-dropdown-btn {
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            padding: 3px 10px 3px 12px;
            border-radius: 30px;
            cursor: pointer;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
            width: 100%;
            min-width: 80px;
            transition: 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 0.85rem !important;
        }
        .agent-dropdown-btn:hover {
            background: rgba(255, 255, 255, 0.20);
        }
        .agent-dropdown-btn .arrow {
            font-size: 0.6rem;
            margin-left: 2px;
            flex-shrink: 0;
        }
        .agent-dropdown-list {
            display: none;
            position: absolute;
            top: 38px;
            left: 0;
            right: 0;
            background: #1c4e6c;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            z-index: 100;
            max-height: 200px;
            overflow-y: auto;
            padding: 3px 0;
            min-width: 160px;
        }
        .agent-dropdown-list.open {
            display: block;
        }
        .agent-dropdown-list::-webkit-scrollbar {
            width: 3px;
        }
        .agent-dropdown-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }
        .agent-dropdown-item {
            display: flex;
            align-items: center;
            padding: 5px 10px;
            cursor: pointer;
            transition: background 0.15s;
            gap: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            color: white;
        }
        .agent-dropdown-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .agent-dropdown-item .agent-info {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            min-width: 0;
        }
        .agent-dropdown-item .agent-logo {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 215, 0, 0.3);
            flex-shrink: 0;
            cursor: pointer;
            transition: transform 0.15s;
        }
        .agent-dropdown-item .agent-logo:hover {
            transform: scale(1.1);
            border-color: #ffd966;
        }
        .agent-dropdown-item .agent-logo-fallback {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }
        .agent-dropdown-item .agent-name {
            font-size: 0.8rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        .agent-dropdown-item .agent-flag {
            font-size: 1rem;
            flex-shrink: 0;
            margin-right: 2px;
        }
        .agent-dropdown-empty {
            padding: 8px;
            text-align: center;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
        }
        .auth-section {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }
        .auth-buttons {
            display: flex;
            gap: 4px;
        }
        .auth-btn {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            padding: 5px 12px;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem !important;
        }
        .auth-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .user-welcome {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(255, 255, 255, 0.12);
            padding: 2px 10px 2px 5px;
            border-radius: 30px;
            height: 34px;
        }
        .user-avatar {
            font-size: 1.2rem;
            line-height: 1;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            display: inline-block;
            background: #2c7da0;
            color: white;
            text-align: center;
            line-height: 28px;
            font-size: 1.2rem;
            flex-shrink: 0;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.2s;
            position: relative;
        }
        .user-avatar:hover {
            opacity: 0.8;
            transform: scale(1.05);
        }
        .user-avatar .avatar-upload-hint {
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.45rem;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 1px 3px;
            border-radius: 3px;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }
        .user-avatar:hover .avatar-upload-hint {
            opacity: 1;
        }
        .user-avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }
        .user-name-display {
            font-weight: 700;
            font-size: 0.8rem;
        }
        .logout-btn {
            background: rgba(255, 255, 255, 0.18);
            border: none;
            padding: 2px 10px;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            font-size: 0.72rem;
            font-weight: 600;
            transition: 0.2s;
            height: 28px;
            display: flex;
            align-items: center;
        }
        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .edit-account-btn {
            background: rgba(255, 255, 255, 0.18);
            border: none;
            padding: 2px 10px;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            font-size: 0.72rem;
            font-weight: 600;
            transition: 0.2s;
            height: 28px;
            display: flex;
            align-items: center;
        }
        .edit-account-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .connection-indicator {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-size: 0.68rem;
            color: #8fdf8f;
            background: rgba(0, 180, 0, 0.15);
            padding: 2px 8px 2px 4px;
            border-radius: 30px;
            border: 1px solid rgba(0, 200, 0, 0.2);
            height: 28px;
        }
        .connection-indicator .connection-dot {
            width: 7px;
            height: 7px;
            background: #2ecc71;
            border-radius: 50%;
            display: inline-block;
            animation: pulse-dot 1.8s ease-in-out infinite;
            box-shadow: 0 0 6px rgba(46, 204, 113, 0.5);
        }
        .connection-indicator .connection-text {
            display: none;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.85); }
        }

        /* ================================================================
           BUTTON ROW LAYOUTS
           ================================================================ */
        .btn-row {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            align-items: center;
        }
        .btn-row .btn,
        .btn-row .action-btn,
        .btn-row .tx-btn,
        .btn-row .single-mm-btn,
        .btn-row .btn-submit {
            flex: 1;
            min-width: 60px;
        }
        .btn-row .btn-sm {
            flex: 0 1 auto;
            min-width: 40px;
        }
        .btn-row-center {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            align-items: center;
            justify-content: center;
        }
        .btn-row-center .btn,
        .btn-row-center .action-btn {
            flex: 0 1 auto;
            min-width: 60px;
        }
        .btn-row-end {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            align-items: center;
            justify-content: flex-end;
        }

        /* ================================================================
           FLAGS STRIP
           ================================================================ */
        .flags-strip {
            background: #f0f4f8;
            border-bottom: 1px solid #e0e8f0;
            padding: 3px 6px;
            display: flex;
            align-items: center;
            gap: 3px;
            transition: opacity 0.3s ease, max-height 0.3s ease;
            position: relative;
            z-index: 5;
            max-height: 40px;
            overflow: hidden;
        }
        .flags-strip.hidden {
            opacity: 0;
            max-height: 0;
            padding: 0;
            margin: 0;
            border: none;
            pointer-events: none;
        }
        .flag-grid-wrapper {
            flex: 1;
            overflow-x: auto;
            scroll-behavior: smooth;
            padding: 3px 0;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .flag-grid-wrapper::-webkit-scrollbar { display: none; }
        .flag-grid {
            display: flex;
            gap: 3px;
            flex-wrap: nowrap;
            white-space: nowrap;
            min-width: max-content;
        }
        .flag-icon {
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
            border-radius: 3px;
            padding: 1px 2px;
            line-height: 1.2;
            user-select: none;
            flex-shrink: 0;
        }
        .flag-icon:hover {
            transform: scale(1.3);
            background: rgba(255, 215, 0, 0.25);
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.4);
            border-radius: 3px;
        }
        .flag-scroll-btn {
            background: rgba(0, 0, 0, 0.15);
            border: none;
            color: #1e3b4a;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: 0.2s;
        }
        .flag-scroll-btn:hover {
            background: rgba(0, 0, 0, 0.3);
            color: white;
        }

        /* ================================================================
           MAIN FORM - Increased font sizes by 15%
           ================================================================ */
        .form-container {
            padding: 0.7rem 0.8rem 0.5rem 0.8rem;
        }
        .profile-section {
            background: #f0f6fb;
            border-radius: 12px;
            padding: 0.5rem 0.7rem;
            margin-bottom: 0.5rem;
            border: 1px solid #dce8f0;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.4rem 0.6rem;
        }
        .profile-section .profile-label {
            font-weight: 700;
            color: #1c6e8f;
            margin-right: 1px;
            font-size: 0.85rem !important;
        }
        .profile-section .profile-field {
            color: #1e3b4a;
            background: white;
            padding: 2px 10px;
            border-radius: 30px;
            border: 1px solid #d0dce8;
            display: inline-block;
            min-width: 45px;
            font-size: 0.8rem !important;
        }
        .profile-section .profile-field:read-only {
            cursor: default;
            background: #f8fafc;
        }
        .map-btn {
            background: #2c7da0;
            border: none;
            padding: 4px 12px;
            border-radius: 30px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            height: 32px;
            font-size: 0.85rem !important;
        }
        .map-btn:hover {
            background: #1f5068;
            transform: translateY(-1px);
        }
        .section-title {
            font-weight: 800;
            color: #1c6e8f;
            margin: 0.4rem 0 0.3rem 0;
            border-left: 3px solid #f4a261;
            padding-left: 8px;
            text-transform: uppercase;
            font-size: 0.85rem !important;
        }
        .section-title:first-of-type { margin-top: 0; }
        .input-group {
            margin-bottom: 0.35rem;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .input-group label {
            font-weight: 700;
            color: #1e3b4a;
            font-size: 0.8rem !important;
        }
        .input-group input, .input-group select {
            padding: 5px 10px;
            border-radius: 18px;
            border: 1.5px solid #e0e8f0;
            font-size: 0.95rem;
            transition: 0.2s;
            outline: none;
            background: #fff;
            height: 38px;
        }
        .input-group input:focus, .input-group select:focus {
            border-color: #f4a261;
            box-shadow: 0 0 0 3px rgba(244, 162, 97, 0.2);
        }
        .input-group input:read-only {
            background: #f5f8fa;
            cursor: default;
        }
        .double-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.4rem;
        }
        .add-client-btn {
            background: #2c7da0;
            border: none;
            color: white;
            border-radius: 30px;
            padding: 5px 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            height: 38px;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            white-space: nowrap;
            font-size: 0.85rem !important;
        }
        .add-client-btn:hover {
            background: #1f5068;
            transform: translateY(-1px);
        }
        .tx-row {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        .tx-row .input-group { flex: 1; margin-bottom: 0; }
        .tx-btn {
            background: #f4a261;
            border: none;
            padding: 5px 12px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            color: white;
            white-space: nowrap;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem !important;
        }
        .tx-btn.copy { background: #2c7da0; }
        .tx-btn:hover {
            transform: translateY(-1px);
            opacity: 0.9;
        }
        .mode-row {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-bottom: 0.35rem;
            align-items: center;
        }
        .mode-row .btn {
            flex: 1;
            padding: 5px 12px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1.5px solid #e0e8f0;
            background: #f1f5f9;
            color: #1e3b4a;
            white-space: nowrap;
            min-width: 80px;
            font-size: 0.85rem !important;
        }
        .mode-row .btn.active {
            background: #0f2b3d;
            color: white;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            border-color: #0f2b3d;
        }
        .mode-row .btn.add-client-btn-header {
            background: #2c7da0;
            color: white;
            border-color: #2c7da0;
        }
        .mode-row .btn.add-client-btn-header:hover {
            background: #1f5068;
            border-color: #1f5068;
        }
        .country-selector-wrapper.hide-country { display: none; }
        .country-selector {
            display: flex;
            gap: 3px;
            align-items: center;
            background: white;
            border: 1.5px solid #e0e8f0;
            border-radius: 30px;
            padding: 0 4px;
            height: 38px;
        }
        .country-flag { font-size: 1.2rem; }
        #countryCodeSelect {
            flex: 1;
            border: none;
            background: transparent;
            padding: 2px 2px;
            outline: none;
            font-size: 0.85rem;
            height: 34px;
        }
        .charges-panel {
            background: #f8fafc;
            border-radius: 12px;
            padding: 0.4rem 0.6rem;
            margin: 0.35rem 0;
            border: 1px solid #e2edf7;
        }
        .charges-row {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
            font-size: 0.8rem !important;
        }
        .total-row {
            font-weight: 800;
            border-top: 2px dashed #cbdde9;
            margin-top: 3px;
            padding-top: 4px;
            font-size: 0.85rem !important;
        }
        .mm-button-container {
            display: flex;
            gap: 4px;
            margin: 4px 0;
        }
        .mm-button-container .single-mm-btn {
            flex: 1;
        }
        .single-mm-btn {
            background: #0f2b3d;
            color: white;
            border: none;
            padding: 7px 14px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem !important;
        }
        .single-mm-btn:hover {
            background: #f4a261;
            transform: translateY(-1px);
        }
        .btn-submit {
            background: #0f2b3d;
            color: white;
            width: 100%;
            padding: 7px 14px;
            border-radius: 30px;
            font-weight: 700;
            margin-top: 0.35rem;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem !important;
        }
        .btn-submit:hover {
            background: #f4a261;
            transform: translateY(-1px);
        }
        .business-strip {
            background: linear-gradient(90deg, #fef9f0 0%, #fff5e8 100%);
            padding: 0.35rem 0.5rem;
            margin-top: 0.35rem;
            border-radius: 12px;
            border: 1px solid #ffe0b5;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: thin;
        }
        .business-strip::-webkit-scrollbar { height: 3px; }
        .business-strip::-webkit-scrollbar-track { background: #ffe0b5; border-radius: 10px; }
        .business-strip::-webkit-scrollbar-thumb { background: #f4a261; border-radius: 10px; }
        .business-title {
            font-weight: 700;
            color: #c97e2a;
            margin-bottom: 2px;
            text-align: center;
            font-size: 0.8rem !important;
        }
        .business-icons {
            display: inline-flex;
            gap: 0.35rem;
            align-items: center;
        }
        .business-item {
            display: inline-flex;

            transition: all 0.2s ease;

        .footer-section {

        .footer-buttons {
            display: flex;

            gap: 4px;
            margin-bottom: 3px;

            background: #eef2f7;

            transition: 0.2s;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.78rem !important;
            flex: 0 1 auto;
        }
        .footer-btn:hover {
            background: #dce5ec;
            transform: translateY(-1px);
        }
        .social-icons {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            justify-content: center;
        }
        .social-icon {
            cursor: pointer;
            padding: 4px 10px;
            background: #eef2f7;
            border-radius: 30px;
            color: #1c6e8f;
            text-decoration: none;
            transition: 0.2s;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.78rem !important;
            flex: 0 1 auto;
        }
        .social-icon:hover {
            background: #dce5ec;
            transform: scale(1.03);
        }

        /* ================================================================
           MODALS - Increased font sizes
           ================================================================ */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(3px);
        }
        .modal-content {
            background: white;
            border-radius: 1.2rem;
            padding: 0.9rem;
            width: 88%;
            max-width: 380px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        .modal-content h3 {
            margin-bottom: 5px;
            font-size: 1.05rem !important;
        }
        .action-buttons-row {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 6px;
        }
        .action-buttons-row .action-btn {
            flex: 1;
            min-width: 50px;
        }
        .action-btn {
            padding: 7px 14px;
            border-radius: 30px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            background: #0f2b3d;
            color: white;
            transition: 0.2s;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem !important;
        }
        .action-btn:hover {
            background: #f4a261;
            transform: translateY(-1px);
        }
        .action-btn.close-modal { background: #ccc; color: #222; }
        .action-btn.close-modal:hover { background: #bbb; }
        .action-btn.orange { background: #f4a261; }
        .action-btn.orange:hover { background: #e08e4a; }
        .action-btn.green { background: #27ae60; }
        .action-btn.green:hover { background: #1e8449; }

        /* ================================================================
           TOAST
           ================================================================ */
        .toast-msg {
            position: fixed;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e2f3c;
            color: white;
            padding: 5px 16px;
            border-radius: 40px;
            z-index: 1100;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;
            max-width: 85%;
            text-align: center;
            font-size: 0.85rem !important;
        }
