
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>AfriPay | Mobile Money & Payment Hub</title>
    <style>
        /* ================================================================
           RESET & BASE
           ================================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: linear-gradient(145deg, #eef2f7 0%, #d9e2ec 100%);
            min-height: 100vh;
            padding: 0.7rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .app-card {
            max-width: 648px;
            width: 100%;
            background: #ffffff;
            border-radius: 1.6rem;
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.22);
            overflow: hidden;
        }

        /* ================================================================
           HEADER
           ================================================================ */
        .live-header {
            background: linear-gradient(135deg, #0a2b3c 0%, #1c4e6c 100%);
            padding: 0.65rem 0.8rem;
            color: white;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            min-height: 72px;
            position: relative;
            z-index: 10;
        }
        .logo-container {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .africa-map-logo {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(255, 255, 255, 0.07);
            padding: 3px 12px 3px 6px;
            border-radius: 30px;
        }
        .africa-svg {
            width: 36px;
            height: 36px;
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.2));
        }
        .brand-text {
            font-size: 1.3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFF, #FFD966, #6bc6ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            cursor: default;
        }
        #dashboardTrigger {
            cursor: pointer;
            transition: 0.15s;
            display: inline-block;
        }
        #dashboardTrigger:hover {
            transform: scale(1.1);
            color: #ffd966;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .datetime-box {
            background: rgba(0, 0, 0, 0.25);
            padding: 0.1rem 0.6rem;
            border-radius: 30px;
            text-align: center;
            font-size: 0.7rem;
            line-height: 1.2;
            min-width: 78px;
        }
        .time-text {
            font-weight: 700;
            font-size: 0.85rem;
        }
        .lang-selector {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(255, 255, 255, 0.10);
            border-radius: 30px;
            padding: 2px 6px 2px 10px;
            height: 40px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .lang-selector select {
            background: transparent;
            border: none;
            color: white;
            font-weight: 600;
            font-size: 0.8rem;
            outline: none;
            cursor: pointer;
            padding: 2px 4px;
            width: 72px;
        }
        .lang-selector select option {
            background: #1c4e6c;
            color: white;
        }
        .lang-icon {
            font-size: 1.0rem;
            line-height: 1;
        }
        .agent-dropdown-container {
            position: relative;
            min-width: 140px;
            max-width: 200px;
        }
        .agent-dropdown-btn {
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            padding: 4px 10px 4px 14px;
            border-radius: 30px;
            cursor: pointer;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            width: 100%;
            min-width: 100px;
            transition: 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .agent-dropdown-btn:hover {
            background: rgba(255, 255, 255, 0.20);
        }
        .agent-dropdown-btn .arrow {
            font-size: 0.6rem;
            margin-left: 4px;
            flex-shrink: 0;
        }
        .agent-dropdown-list {
            display: none;
            position: absolute;
            top: 44px;
            left: 0;
            right: 0;
            background: #1c4e6c;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            z-index: 100;
            max-height: 260px;
            overflow-y: auto;
            padding: 4px 0;
            min-width: 200px;
        }
        .agent-dropdown-list.open {
            display: block;
        }
        .agent-dropdown-list::-webkit-scrollbar {
            width: 4px;
        }
        .agent-dropdown-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }
        .agent-dropdown-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 12px;
            cursor: pointer;
            transition: background 0.15s;
            gap: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            color: white;
        }
        .agent-dropdown-item:hover {
            background: rgba(255, 255, 255, 0.12);
        }
        .agent-dropdown-item .agent-name {
            font-size: 0.8rem;
            font-weight: 500;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .agent-dropdown-item .edit-agent-btn {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: white;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            flex-shrink: 0;
            height: 28px;
            display: flex;
            align-items: center;
        }
        .agent-dropdown-item .edit-agent-btn:hover {
            background: rgba(255, 215, 0, 0.3);
        }
        .agent-dropdown-empty {
            padding: 12px;
            text-align: center;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.6);
        }
        .auth-section {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .auth-buttons {
            display: flex;
            gap: 6px;
        }
        .auth-btn {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            padding: 7px 14px;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .user-welcome {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.12);
            padding: 3px 12px 3px 6px;
            border-radius: 30px;
            height: 40px;
        }
        .user-avatar {
            font-size: 1.3rem;
            line-height: 1;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            display: inline-block;
            background: #2c7da0;
            color: white;
            text-align: center;
            line-height: 32px;
            font-size: 1.3rem;
            flex-shrink: 0;
        }
        .user-avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }
        .user-name-display {
            font-weight: 700;
            font-size: 0.85rem;
        }
        .logout-btn {
            background: rgba(255, 255, 255, 0.18);
            border: none;
            padding: 3px 10px;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: 600;
            transition: 0.2s;
            height: 32px;
            display: flex;
            align-items: center;
        }
        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .connection-indicator {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.7rem;
            color: #8fdf8f;
            background: rgba(0, 180, 0, 0.15);
            padding: 2px 10px 2px 4px;
            border-radius: 30px;
            border: 1px solid rgba(0, 200, 0, 0.2);
            height: 32px;
        }
        .connection-dot {
            width: 8px;
            height: 8px;
            background: #2ecc71;
            border-radius: 50%;
            display: inline-block;
            animation: pulse-dot 1.8s ease-in-out infinite;
            box-shadow: 0 0 6px rgba(46, 204, 113, 0.5);
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(0.85);
            }
        }

        /* ================================================================
           FLAGS STRIP
           ================================================================ */
        .flags-strip {
            background: #f0f4f8;
            border-bottom: 1px solid #e0e8f0;
            padding: 4px 8px;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: opacity 0.3s ease, max-height 0.3s ease;
            position: relative;
            z-index: 5;
            max-height: 50px;
            overflow: hidden;
        }
        .flags-strip.hidden {
            opacity: 0;
            max-height: 0;
            padding: 0;
            margin: 0;
            border: none;
            pointer-events: none;
        }
        .flag-grid-wrapper {
            flex: 1;
            overflow-x: auto;
            scroll-behavior: smooth;
            padding: 4px 0;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .flag-grid-wrapper::-webkit-scrollbar {
            display: none;
        }
        .flag-grid {
            display: flex;
            gap: 4px;
            flex-wrap: nowrap;
            white-space: nowrap;
            min-width: max-content;
        }
        .flag-icon {
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
            border-radius: 4px;
            padding: 1px 2px;
            line-height: 1.3;
            user-select: none;
            flex-shrink: 0;
        }
        .flag-icon:hover {
            transform: scale(1.4);
            background: rgba(255, 215, 0, 0.25);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
            border-radius: 4px;
        }
        .flag-scroll-btn {
            background: rgba(0, 0, 0, 0.15);
            border: none;
            color: #1e3b4a;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: 0.2s;
        }
        .flag-scroll-btn:hover {
            background: rgba(0, 0, 0, 0.3);
            color: white;
        }

        /* ================================================================
           MAIN FORM
           ================================================================ */
        .form-container {
            padding: 0.9rem 1.0rem 0.6rem 1.0rem;
        }
        .profile-section {
            background: #f0f6fb;
            border-radius: 14px;
            padding: 0.55rem 0.8rem;
            margin-bottom: 0.6rem;
            border: 1px solid #dce8f0;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.4rem 0.8rem;
        }
        .profile-section .profile-label {
            font-weight: 700;
            color: #1c6e8f;
            margin-right: 2px;
        }
        .profile-section .profile-field {
            color: #1e3b4a;
            background: white;
            padding: 2px 10px;
            border-radius: 30px;
            border: 1px solid #d0dce8;
            display: inline-block;
            min-width: 60px;
        }
        .profile-section .profile-field:read-only {
            cursor: default;
            background: #f8fafc;
        }
        .map-btn {
            background: #2c7da0;
            border: none;
            padding: 6px 12px;
            border-radius: 30px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            margin-left: auto;
            height: 38px;
        }
        .map-btn:hover {
            background: #1f5068;
            transform: translateY(-1px);
        }
        .section-title {
            font-weight: 800;
            color: #1c6e8f;
            margin: 0.5rem 0 0.35rem 0;
            border-left: 3px solid #f4a261;
            padding-left: 8px;
            text-transform: uppercase;
        }
        .section-title:first-of-type {
            margin-top: 0;
        }
        .input-group {
            margin-bottom: 0.4rem;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .input-group label {
            font-weight: 700;
            color: #1e3b4a;
        }
        .input-group input,
        .input-group select {
            padding: 6px 10px;
            border-radius: 20px;
            border: 1.5px solid #e0e8f0;
            font-size: 0.9rem;
            transition: 0.2s;
            outline: none;
            background: #fff;
            height: 42px;
        }
        .input-group input:focus,
        .input-group select:focus {
            border-color: #f4a261;
            box-shadow: 0 0 0 3px rgba(244, 162, 97, 0.2);
        }
        .input-group input:read-only {
            background: #f5f8fa;
            cursor: default;
        }
        .double-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }
        .add-client-btn {
            background: #2c7da0;
            border: none;
            color: white;
            border-radius: 30px;
            padding: 6px 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            height: 42px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            margin-top: 0.3rem;
        }
        .add-client-btn:hover {
            background: #1f5068;
            transform: translateY(-1px);
        }
        .tx-row {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        .tx-row .input-group {
            flex: 1;
            margin-bottom: 0;
        }
        .tx-btn {
            background: #f4a261;
            border: none;
            padding: 7px 11px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            color: white;
            white-space: nowrap;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .tx-btn.copy {
            background: #2c7da0;
        }
        .tx-btn:hover {
            transform: translateY(-1px);
            opacity: 0.9;
        }
        .mode-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 0.4rem;
            align-items: center;
        }
        .mode-row .btn {
            flex: 0 1 auto;
            padding: 6px 14px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1.5px solid #e0e8f0;
            background: #f1f5f9;
            color: #1e3b4a;
            white-space: nowrap;
            min-width: 100px;
        }
        .mode-row .btn.active {
            background: #0f2b3d;
            color: white;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            border-color: #0f2b3d;
        }
        .mode-row .btn.add-client-btn-header {
            background: #2c7da0;
            color: white;
            border-color: #2c7da0;
        }
        .mode-row .btn.add-client-btn-header:hover {
            background: #1f5068;
            border-color: #1f5068;
        }
        .country-selector-wrapper.hide-country {
            display: none;
        }
        .country-selector {
            display: flex;
            gap: 3px;
            align-items: center;
            background: white;
            border: 1.5px solid #e0e8f0;
            border-radius: 30px;
            padding: 0 4px;
            height: 42px;
        }
        .country-flag {
            font-size: 1.3rem;
        }
        #countryCodeSelect {
            flex: 1;
            border: none;
            background: transparent;
            padding: 4px 2px;
            outline: none;
            font-size: 0.85rem;
            height: 36px;
        }
        .charges-panel {
            background: #f8fafc;
            border-radius: 14px;
            padding: 0.5rem 0.7rem;
            margin: 0.4rem 0;
            border: 1px solid #e2edf7;
        }
        .charges-row {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
        }
        .total-row {
            font-weight: 800;
            border-top: 2px dashed #cbdde9;
            margin-top: 3px;
            padding-top: 4px;
        }
        .mm-button-container {
            display: flex;
            justify-content: center;
            margin: 5px 0;
        }
        .single-mm-btn {
            background: #0f2b3d;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .single-mm-btn:hover {
            background: #f4a261;
            transform: translateY(-1px);
        }
        .btn-submit {
            background: #0f2b3d;
            color: white;
            width: 100%;
            padding: 10px 12px;
            border-radius: 30px;
            font-weight: 700;
            margin-top: 0.5rem;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-submit:hover {
            background: #f4a261;
            transform: translateY(-1px);
        }
        .business-strip {
            background: linear-gradient(90deg, #fef9f0 0%, #fff5e8 100%);
            padding: 0.4rem 0.5rem;
            margin-top: 0.4rem;
            border-radius: 14px;
            border: 1px solid #ffe0b5;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: thin;
        }
        .business-strip::-webkit-scrollbar {
            height: 3px;
        }
        .business-strip::-webkit-scrollbar-track {
            background: #ffe0b5;
            border-radius: 10px;
        }
        .business-strip::-webkit-scrollbar-thumb {
            background: #f4a261;
            border-radius: 10px;
        }
        .business-title {
            font-weight: 700;
            color: #c97e2a;
            margin-bottom: 3px;
            text-align: center;
        }
        .business-icons {
            display: inline-flex;
            gap: 0.4rem;
            align-items: center;
        }
        .business-item {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            background: white;
            padding: 4px 8px;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid #ffe0b5;
            min-width: 58px;
        }
        .business-item:hover {
            transform: translateY(-2px);
            border-color: #f4a261;
            background: #fffaf5;
        }
        .business-icon-img {
            font-size: 1.2rem;
            margin-bottom: 1px;
        }
        .business-name {
            font-weight: 700;
            color: #1c6e8f;
        }
        .business-category {
            color: #e67e22;
        }

        /* ================================================================
           FOOTER
           ================================================================ */
        .footer-section {
            background: #f8fafc;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
            padding: 0.5rem 0.6rem;
        }
        .footer-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 3px;
        }
        .footer-btn {
            background: #eef2f7;
            border: none;
            padding: 4px 12px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            color: #1c6e8f;
            transition: 0.2s;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .footer-btn:hover {
            background: #dce5ec;
            transform: translateY(-1px);
        }
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .social-icon {
            cursor: pointer;
            padding: 4px 12px;
            background: #eef2f7;
            border-radius: 30px;
            color: #1c6e8f;
            text-decoration: none;
            transition: 0.2s;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .social-icon:hover {
            background: #dce5ec;
            transform: scale(1.03);
        }

        /* ================================================================
           MODALS
           ================================================================ */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(3px);
        }
        .modal-content {
            background: white;
            border-radius: 1.6rem;
            padding: 1.0rem 1.1rem;
            width: 88%;
            max-width: 380px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        .modal-content h3 {
            margin-bottom: 6px;
        }
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-top: 8px;
        }
        .action-buttons-row {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 8px;
        }
        .action-buttons-row .action-btn {
            flex: 1;
            min-width: 60px;
        }
        .action-btn {
            padding: 10px 14px;
            border-radius: 30px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            background: #0f2b3d;
            color: white;
            transition: 0.2s;
            height: 44px;
            display: flex;
            align-items: center;
